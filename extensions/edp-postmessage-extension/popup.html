<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>EDP PostMessage Debugger</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      width: 360px;
      padding: 10px 14px 16px;
      background: #1e1e1e;
      color: #eee;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
      color: #4fc3f7;
    }
    section {
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }
    section h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9e9e9e;
      margin: 0 0 6px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #bbb;
      margin-top: 6px;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #eee;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 12px;
      margin-top: 2px;
    }
    button {
      width: 100%;
      margin-top: 8px;
      background: #4fc3f7;
      border: none;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: #003547;
    }
    button:hover {
      background: #29b6f6;
    }
    button.secondary {
      background: #37474f;
      color: #eee;
    }
    button.secondary:hover {
      background: #455a64;
    }
    .row {
      display: flex;
      gap: 6px;
    }
    .row button {
      margin-top: 8px;
    }
    .field-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .field-row button.now {
      width: auto;
      flex: 0 0 auto;
      margin-top: 2px;
      padding: 4px 8px;
      font-size: 11px;
      background: #37474f;
      color: #eee;
    }
    .field-row button.now:hover {
      background: #455a64;
    }
    #status {
      font-size: 11px;
      margin-top: 8px;
      min-height: 14px;
      color: #81c784;
    }
    #status.error {
      color: #e57373;
    }
  </style>
</head>
<body>
  <h1>EDP PostMessage Debugger</h1>

  <section>
    <h2>Add drug</h2>
    <label>Product / Protocol ID (vide = ouvre la recherche)</label>
    <input type="number" id="addProductId" placeholder="ex: 33791" />
    <label>Type</label>
    <select id="addType">
      <option value="PRODUCT">PRODUCT</option>
      <option value="PROTOCOL">PROTOCOL</option>
    </select>
    <label>Date (optionnel, ISO)</label>
    <div class="field-row">
      <input type="text" id="addDate" placeholder="null si vide" />
      <button type="button" class="now" data-now-target="addDate" title="Remplir avec la date/heure actuelle">Now</button>
    </div>
    <button id="btnAdd">orme.drug.add</button>
  </section>

  <section>
    <h2>Delete drug (ligne non signée)</h2>
    <label>Product ID</label>
    <input type="number" id="deleteProductId" placeholder="ex: 33791" />
    <label>Type</label>
    <select id="deleteType">
      <option value="PRODUCT">PRODUCT</option>
      <option value="PROTOCOL">PROTOCOL</option>
    </select>
    <button id="btnDelete">orme.drug.delete</button>
  </section>

  <section>
    <h2>Stop lines</h2>
    <label>Stop date (ISO)</label>
    <div class="field-row">
      <input type="text" id="stopDate" placeholder="2026-05-05T14:30:00" />
      <button type="button" class="now" data-now-target="stopDate" title="Remplir avec la date/heure actuelle">Now</button>
    </div>
    <label>Prescription line IDs (séparés par virgule)</label>
    <input type="text" id="stopLineIds" placeholder="128982,128983" />
    <button id="btnStop">orme.prescription_line.stop</button>
  </section>

  <section>
    <h2>Actions globales</h2>
    <div class="row">
      <button class="secondary" id="btnSign">orme.sign</button>
      <button class="secondary" id="btnSignOnBehalf">orme.sign_on_behalf</button>
    </div>
    <div class="row">
      <button class="secondary" id="btnSave">orme.save</button>
      <button class="secondary" id="btnCancel">orme.cancel</button>
    </div>
  </section>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
