<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <title>GitHub Team Reviewers</title>
    <style>
        body {
            margin: 0;
            padding: 14px;
            width: 260px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 13px;
            color: #1f2328;
        }

        h1 {
            font-size: 14px;
            margin: 0 0 10px;
        }

        #list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .member {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 600;
            text-align: left;
            color: #1f2328;
            background-color: #ffffff;
            border: 1px solid rgba(31, 35, 40, 0.15);
            border-radius: 6px;
            cursor: pointer;
        }

        .member:hover:not(:disabled) {
            background-color: #eff2f5;
        }

        .member:disabled {
            cursor: default;
            opacity: 0.6;
        }

        .member img {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
        }

        .member span {
            flex: 1 1 auto;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .badge {
            flex: 0 0 auto;
            font-size: 10px;
            font-weight: 500;
            color: #59636e;
        }

        #message {
            margin: 10px 0 0;
            font-size: 12px;
            line-height: 16px;
            color: #59636e;
        }

        #message.error {
            color: #cf222e;
        }

        footer {
            margin-top: 12px;
            font-size: 12px;
        }

        a {
            color: #0969da;
        }
    </style>
</head>
<body>
    <h1>GitHub Team Reviewers</h1>
    <div id="list"></div>
    <p id="message"></p>
    <footer><a id="options" href="#">Options</a></footer>
    <script src="popup.js"></script>
</body>
</html>
