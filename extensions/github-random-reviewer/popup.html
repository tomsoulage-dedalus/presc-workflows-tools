<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <title>GitHub Random Assignee</title>
    <style>
        body {
            margin: 0;
            padding: 14px;
            width: 260px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 13px;
            color: #1f2328;
        }

        h1 {
            font-size: 14px;
            margin: 0 0 10px;
        }

        button {
            width: 100%;
            padding: 7px 12px;
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            background-color: #1f883d;
            border: 1px solid rgba(31, 35, 40, 0.15);
            border-radius: 6px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: progress;
        }

        #result {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        #avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        #message {
            line-height: 18px;
        }

        #message.error {
            color: #cf222e;
        }

        a {
            display: inline-block;
            margin-top: 12px;
            font-size: 12px;
            color: #0969da;
        }
    </style>
</head>
<body>
    <h1>GitHub Random Assignee</h1>
    <button id="assign" type="button">🎲 Assigner au hasard</button>
    <div id="result">
        <img id="avatar" alt="" hidden />
        <div id="message"></div>
    </div>
    <a id="options" href="#">Options</a>

    <script src="popup.js"></script>
</body>
</html>
