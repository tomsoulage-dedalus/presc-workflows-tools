<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <title>GitHub Random Assignee - Options</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 14px;
            color: #1f2328;
            max-width: 620px;
        }

        h1 {
            font-size: 18px;
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .field {
            margin-bottom: 20px;
        }

        .hint {
            font-weight: 400;
            font-size: 12px;
            color: #59636e;
            margin-top: 4px;
        }

        input[type="password"],
        input[type="text"],
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 6px 10px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid rgba(31, 35, 40, 0.15);
            border-radius: 6px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .checkbox {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 12px;
        }

        .checkbox label {
            margin: 0;
            font-weight: 400;
        }

        button {
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            background-color: #1f883d;
            border: 1px solid rgba(31, 35, 40, 0.15);
            border-radius: 6px;
            cursor: pointer;
        }

        #status {
            margin-left: 12px;
            font-size: 13px;
            color: #1a7f37;
        }
    </style>
</head>
<body>
    <h1>GitHub Random Assignee</h1>

    <div class="field">
        <label for="token">Token GitHub (PAT)</label>
        <input id="token" type="password" autocomplete="off" placeholder="ghp_..." />
        <p class="hint">
            Token classique avec le scope <code>repo</code>, ou fine-grained avec les permissions
            <code>Pull requests: Read and write</code> et <code>Issues: Read and write</code>.
            Il est stocke uniquement dans le stockage local du navigateur.
        </p>
    </div>

    <div class="field">
        <label for="users">Utilisateurs candidats</label>
        <textarea id="users" placeholder="alice, bob, carol"></textarea>
        <p class="hint">Logins GitHub separes par des virgules, des espaces ou des retours a la ligne.</p>
    </div>

    <div class="field">
        <div class="checkbox">
            <input id="excludeSelf" type="checkbox" />
            <label for="excludeSelf">Exclure l'auteur de la PR du tirage</label>
        </div>
        <div class="checkbox">
            <input id="requestReview" type="checkbox" />
            <label for="requestReview">Demander aussi une revue a l'utilisateur tire</label>
        </div>
        <div class="checkbox">
            <input id="replaceExisting" type="checkbox" />
            <label for="replaceExisting">Remplacer les assignes existants au lieu d'ajouter</label>
        </div>
    </div>

    <button id="save" type="button">Enregistrer</button>
    <span id="status"></span>

    <script src="options.js"></script>
</body>
</html>
